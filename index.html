<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanalıma Katıl</title>
  <style>
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .btn {
      background: #229ED9;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 32px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(34, 158, 217, 0.4);
      display: inline-block;
      margin-top: 20px;
      border: none;
      cursor: pointer;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>Özel Kanala Katılmak İçin Dokun 👇</h2>
  <button onclick="openTelegram()" class="btn">Telegram'da Aç 🚀</button>
  <p>Açılmazsa sağ üstteki üç noktadan (⋮) "Tarayıcıda Aç" seçeneğine dokunun.</p>

  <script>
    function openTelegram() {
      // 1. Doğrudan uygulamaya fırlatmayı dene
      window.location.href = "tg://resolve?domain=nisakavlak";
      
      // 2. TikTok bloklarsa 0.5 saniye sonra güvenli web bağlantısına devret
      setTimeout(function() {
        window.location.href = "https://t.me/nisakavlak";
      }, 500);
    }
  </script>
</body>
</html>
